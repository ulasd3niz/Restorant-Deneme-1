<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SmartPOS — Müşteri Menüsü</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f0c060;--gold2:#e8a020;--red:#ff4b4b;--green:#22c55e;--blue:#38bdf8;
  --bg:#0a0a0f;--glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.08);--text:#e8e8f0;--muted:#7878a0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:120px;}
.syne{font-family:'Syne',sans-serif;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(240,192,96,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.nav-logo{display:flex;align-items:center;gap:8px;}
.nav-logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:14px;}
.nav-title{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--gold);}
.nav-actions{display:flex;align-items:center;gap:8px;}

/* TICKER */
.ticker-wrap{overflow:hidden;background:linear-gradient(90deg,rgba(240,192,96,0.08),rgba(240,192,96,0.04));border-bottom:1px solid rgba(240,192,96,0.15);padding:7px 0;display:none;}
.ticker-inner{display:inline-flex;gap:80px;white-space:nowrap;animation:ticker 30s linear infinite;font-size:12px;color:var(--gold);padding-left:100%;}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .22s;text-decoration:none;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1000;}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(240,192,96,0.3);}
.btn-ghost{background:var(--glass);border-color:var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--glass2);}
.btn-red{background:rgba(255,75,75,0.12);border-color:rgba(255,75,75,0.3);color:#ff8080;}
.btn-green{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.3);color:#4ade80;}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px;}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:7px;}

/* CARD */
.card{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;transition:all .25s;}
.card-gold{border-color:rgba(240,192,96,0.2);}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.b-gold{background:rgba(240,192,96,0.12);color:var(--gold);border:1px solid rgba(240,192,96,0.22);}
.b-red{background:rgba(255,75,75,0.12);color:#ff8080;border:1px solid rgba(255,75,75,0.22);}
.b-green{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.22);}
.b-blue{background:rgba(56,189,248,0.12);color:#7dd3fc;border:1px solid rgba(56,189,248,0.22);}

/* INPUT */
.inp{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:9px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;outline:none;transition:all .2s;}
.inp:focus{border-color:rgba(240,192,96,0.4);background:var(--glass2);}
.inp::placeholder{color:var(--muted);}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--glass);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted);font-family:'Syne',sans-serif;}
.chip.active{background:rgba(240,192,96,0.1);border-color:rgba(240,192,96,0.4);color:var(--gold);}

/* MENU CARD */
.menu-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all .28s;cursor:pointer;position:relative;}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(0,0,0,0.45);border-color:rgba(255,255,255,0.13);}
.menu-card img{width:100%;height:150px;object-fit:cover;display:block;}
.menu-card-body{padding:12px;}
.mc-name{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:4px;line-height:1.3;}
.mc-desc{font-size:11px;color:var(--muted);margin-bottom:7px;line-height:1.4;}
.mc-foot{display:flex;align-items:center;justify-content:space-between;}
.mc-price{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--gold);}
.mc-meta{font-size:10px;color:var(--muted);}
.mc-allergens{display:flex;gap:4px;margin-top:5px;font-size:12px;flex-wrap:wrap;}
.mc-add{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(240,192,96,0.85);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#1a1000;transition:all .2s;}
.mc-add:hover{background:var(--gold);transform:scale(1.1);}
.mc-qty-badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1000;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;}

/* JUKEBOX */
.jb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;transition:all .2s;cursor:pointer;border:1px solid transparent;}
.jb-item:hover{background:var(--glass2);}
.jb-item.playing{background:rgba(240,192,96,0.07);border-color:rgba(240,192,96,0.2);}
.jb-rank{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;min-width:22px;text-align:center;}

/* CART FLOAT */
.cart-float{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:0;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:16px;padding:14px 22px;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:#1a1000;cursor:pointer;box-shadow:0 12px 40px rgba(240,192,96,0.4);transition:all .3s;white-space:nowrap;}
.cart-float:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 18px 52px rgba(240,192,96,0.5);}
.cart-float.hidden{transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;}
.cart-count{background:#1a1000;color:var(--gold);border-radius:8px;padding:2px 8px;font-size:12px;margin-left:10px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:#111120;border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;transform:translateY(60px);transition:all .35s cubic-bezier(.22,1,.36,1);}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);margin:12px auto 0;}

/* PROG BAR */
.prog-bar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s;}

/* WAIT CARD */
.wait-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:13px;background:rgba(240,192,96,0.05);border:1px solid rgba(240,192,96,0.15);}

/* SECTION HEADER */
.section-header{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--gold);margin-bottom:12px;margin-top:6px;display:flex;align-items:center;gap:8px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
@keyframes toastIn{from{transform:translateX(120px);opacity:0;}to{transform:translateX(0);opacity:1;}}

@media(max-width:480px){.menu-grid{grid-template-columns:1fr 1fr !important;}.cart-float{width:90%;justify-content:center;}}
</style>
</head>
<body>
<div id="toast-zone"></div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">
    <div class="nav-logo-icon">🍽️</div>
    <div>
      <div class="nav-title">SmartPOS</div>
    </div>
  </div>
  <div class="nav-actions">
    <span class="badge b-gold" id="masa-badge">Masa ?</span>
    <button class="btn btn-ghost btn-sm" onclick="openModal('camera')"><i class="fas fa-video"></i></button>
    <button class="btn btn-ghost btn-sm" onclick="openModal('waiter-call')"><i class="fas fa-bell"></i></button>
    <a href="index.html" class="btn btn-ghost btn-sm"><i class="fas fa-home"></i></a>
  </div>
</nav>

<!-- TICKER -->
<div class="ticker-wrap" id="ticker-wrap">
  <div class="ticker-inner" id="ticker-text"></div>
</div>

<!-- MAIN -->
<div style="max-width:680px;margin:0 auto;padding:16px;">

  <!-- INFO HEADER -->
  <div class="card card-gold p-4 mb-5">
    <div class="flex items-center justify-between mb-3" style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div id="masa-title" class="syne" style="font-size:22px;font-weight:800;">Masa ?</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;">Dijital Menü & Sipariş Sistemi</div>
      </div>
      <div style="text-align:right;">
        <div id="live-clock" class="syne" style="font-size:22px;font-weight:800;color:var(--gold);"></div>
        <div style="font-size:10px;color:var(--muted);">Canlı Saat</div>
      </div>
    </div>
    <div class="wait-card">
      <i class="fas fa-clock" style="color:var(--gold);font-size:18px;"></i>
      <div style="flex:1;">
        <div style="font-size:11px;color:var(--muted);">Tahmini Bekleme Süresi</div>
        <div id="wait-time" class="syne" style="font-weight:800;font-size:16px;color:var(--gold);">Hesaplanıyor...</div>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="margin-bottom:14px;">
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;">
      <span class="chip" id="chip-vegan" onclick="toggleFilter('vegan')"><i class="fas fa-leaf"></i> Vegan</span>
      <span class="chip" id="chip-gluten" onclick="toggleFilter('gluten')"><i class="fas fa-wheat-awn-circle-exclamation"></i> Glutensiz</span>
      <span class="chip" id="chip-popular" onclick="toggleFilter('popular')"><i class="fas fa-fire"></i> Popüler</span>
    </div>
    <input class="inp" id="search-inp" placeholder="🔍 Menüde ara..." oninput="applyFilters()"/>
  </div>

  <!-- MENU -->
  <div id="menu-section"></div>

  <!-- JUKEBOX -->
  <div class="card p-4 mb-5">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div class="section-header" style="margin:0;"><i class="fas fa-music"></i> Ortak Jukebox</div>
      <span class="badge b-green"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:4px;animation:pulse 1.5s infinite;"></span>CANLI</span>
    </div>
    <div id="jukebox-list"></div>
  </div>

  <!-- MY ORDER (gönderilmiş siparişler) -->
  <div class="card p-4 mb-4" id="my-orders-card" style="display:none;">
    <div class="section-header"><i class="fas fa-receipt"></i> Aktif Siparişlerim</div>
    <div id="my-orders-list"></div>
  </div>

</div>

<!-- CART FLOAT BUTTON -->
<div class="cart-float hidden" id="cart-float" onclick="openModal('cart')">
  <i class="fas fa-shopping-basket"></i>&nbsp; Sepetim
  <span class="cart-count" id="cart-count">0</span>
  &nbsp;·&nbsp; <span id="cart-total-float">0₺</span>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box">
    <div class="modal-handle"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
/* ─── STATE ─── */
const params = new URLSearchParams(window.location.search);
const TABLE_ID = parseInt(params.get('masa')) || 1;
let cart = [];   // [{id, qty, note}]
let filters = {vegan:false, gluten:false, popular:false, search:''};

/* ─── INIT ─── */
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('masa-badge').textContent = `Masa ${TABLE_ID}`;
  document.getElementById('masa-title').textContent = `Masa ${TABLE_ID}`;
  startClock();
  initTicker();
  renderMenu();
  renderJukebox();
  renderMyOrders();
  updateWait();
  setInterval(()=>{ renderMyOrders(); updateWait(); renderJukebox(); }, 4000);
  // StorageEvent: başka sekme değişince anlık güncelle
  window.addEventListener('storage', e => {
    if(e.key !== DB.KEY) return;
    renderMyOrders();
    updateWait();
  });
});

/* ─── CART UTILS ─── */
function cartAdd(id) {
  const ex = cart.find(c=>c.id===id);
  if(ex) ex.qty++;
  else cart.push({id, qty:1, note:''});
  updateCartUI();
  const m = menuById(id);
  toast(`✅ ${m.name} sepete eklendi`,'success');
}
function cartChange(id, delta) {
  const ex = cart.find(c=>c.id===id);
  if(!ex) return;
  ex.qty += delta;
  if(ex.qty <= 0) cart = cart.filter(c=>c.id!==id);
  updateCartUI();
  if(document.getElementById('modal-box').querySelector('.cart-modal')) renderCartModal();
}
function cartRemove(id) {
  cart = cart.filter(c=>c.id!==id);
  updateCartUI();
  if(document.getElementById('modal-box').querySelector('.cart-modal')) renderCartModal();
}
function cartTotal() { return cart.reduce((s,c)=>{ const m=menuById(c.id); return s+(m?m.price*c.qty:0); },0); }
function cartCount() { return cart.reduce((s,c)=>s+c.qty,0); }
function updateCartUI() {
  const cnt = cartCount();
  const total = cartTotal();
  const btn = document.getElementById('cart-float');
  document.getElementById('cart-count').textContent = cnt;
  document.getElementById('cart-total-float').textContent = total+'₺';
  if(cnt>0) btn.classList.remove('hidden'); else btn.classList.add('hidden');
  renderMenu(); // refresh qty badges
}

/* ─── FILTERS ─── */
function toggleFilter(f) {
  filters[f] = !filters[f];
  document.getElementById(`chip-${f}`).classList.toggle('active', filters[f]);
  renderMenu();
}
function applyFilters() {
  filters.search = document.getElementById('search-inp').value.toLowerCase();
  renderMenu();
}
function filteredMenu() {
  let items = [...MENU];
  if(filters.vegan) items = items.filter(m=>m.vegan);
  if(filters.gluten) items = items.filter(m=>!m.gluten);
  if(filters.popular){ const top=top3Ids(); items=items.filter(m=>top.includes(m.id)); }
  if(filters.search) items = items.filter(m=>m.name.toLowerCase().includes(filters.search)||m.desc.toLowerCase().includes(filters.search));
  return items;
}

/* ─── RENDER MENU ─── */
const CAT_META = {
  burger:{label:'🍔 Burgerler'},
  pizza:{label:'🍕 Pizzalar'},
  pasta:{label:'🍝 Makarna & Risotto'},
  salad:{label:'🥗 Salata & Bowl'},
  dessert:{label:'🍮 Tatlılar'},
  drink:{label:'🥤 İçecekler'},
};
function renderMenu() {
  const sec = document.getElementById('menu-section');
  const items = filteredMenu();
  let html = '';
  ['burger','pizza','pasta','salad','dessert','drink'].forEach(cat => {
    const catItems = items.filter(m=>m.cat===cat);
    if(!catItems.length) return;
    html += `<div class="section-header">${CAT_META[cat].label}</div>
    <div class="menu-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;">
      ${catItems.map(m => renderMenuCard(m)).join('')}
    </div>`;
  });
  if(!html) html = `<div class="card p-6" style="text-align:center;color:var(--muted);">Filtreye uygun ürün bulunamadı.</div>`;
  sec.innerHTML = html;
}
function allergenIcons(m) {
  let s='';
  if(m.vegan) s+='<span title="Vegan">🌿</span>';
  if(m.gluten) s+='<span title="Glüten">⚠️G</span>';
  if(m.dairy) s+='<span title="Süt">🥛</span>';
  if(m.nuts) s+='<span title="Kuruyemiş">🥜</span>';
  if(m.hot) s+='<span title="Acı">🌶️</span>';
  return s;
}
function renderMenuCard(m) {
  const inCart = cart.find(c=>c.id===m.id);
  const cnt = inCart ? inCart.qty : 0;
  const scnt = salesCount(m.id);
  return `<div class="menu-card" onclick="openModal('menu-item','${m.id}')">
    <div style="position:relative;">
      <img src="${m.img}" alt="${m.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80'"/>
      ${m.hot?'<span class="badge b-red" style="position:absolute;top:8px;left:8px;">🌶️ Acı</span>':''}
      ${cnt>0?`<div class="mc-qty-badge">${cnt}</div>`:`<button class="mc-add" onclick="event.stopPropagation();cartAdd('${m.id}')">+</button>`}
    </div>
    <div class="menu-card-body">
      <div class="mc-name">${m.name}</div>
      <div class="mc-desc">${m.desc.substring(0,55)}…</div>
      <div class="mc-foot">
        <span class="mc-price">${m.price}₺</span>
        <span class="mc-meta">${m.cal}kcal · ${m.prep}dk</span>
      </div>
      <div class="mc-allergens">${allergenIcons(m)}${scnt>0?`<span style="margin-left:auto;font-size:10px;color:var(--muted);">${scnt}× satıldı</span>`:''}</div>
    </div>
  </div>`;
}

/* ─── JUKEBOX ─── */
function renderJukebox() {
  const state = DB.get();
  const list = [...state.jukebox].sort((a,b)=>b.votes-a.votes);
  document.getElementById('jukebox-list').innerHTML = list.map((s,i)=>`
  <div class="jb-item ${i===0?'playing':''}">
    <div class="jb-rank" style="color:${i===0?'var(--gold)':'var(--muted)'};">${i+1}</div>
    <div style="flex:1;">
      <div style="font-size:13px;font-weight:500;">${s.title}</div>
      <div style="font-size:11px;color:var(--muted);">${s.artist} · ${s.dur}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:12px;color:var(--muted);">${s.votes}</span>
      <button class="btn btn-ghost btn-xs" onclick="voteJukebox('${s.id}')"><i class="fas fa-thumbs-up"></i></button>
    </div>
    ${i===0?'<i class="fas fa-volume-high" style="color:var(--gold);font-size:12px;"></i>':''}
  </div>`).join('');
}
function voteJukebox(id) {
  DB.update(s=>{ const j=s.jukebox.find(x=>x.id===id); if(j)j.votes++; });
  renderJukebox();
  const j = DB.get().jukebox.find(x=>x.id===id);
  toast(`🎵 "${j?.title}" için oy verildi!`,'success');
}

/* ─── MY ORDERS ─── */
function renderMyOrders() {
  const state = DB.get();
  const table = state.tables.find(t=>t.id===TABLE_ID);
  const card = document.getElementById('my-orders-card');
  const list = document.getElementById('my-orders-list');
  if(!table || !table.orders.length){ card.style.display='none'; return; }
  card.style.display='block';
  const total = tableTotal(table);
  list.innerHTML = table.orders.map(o=>{
    const m=menuById(o.id);if(!m)return'';
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
      <img src="${m.img}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200&q=60'"/>
      <div style="flex:1;"><div style="font-size:13px;font-weight:500;">${m.name}</div><div style="font-size:11px;color:var(--muted);">x${o.qty} · ${o.sentAt?new Date(o.sentAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}</div></div>
      <div style="font-family:'Syne',sans-serif;font-weight:800;color:var(--gold);">${m.price*o.qty}₺</div>
    </div>`;
  }).join('') + `<div style="display:flex;justify-content:space-between;padding-top:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;">
    <span>Toplam</span><span style="color:var(--gold);">${total}₺</span></div>`;
}

/* ─── WAIT TIME ─── */
function updateWait() {
  document.getElementById('wait-time').textContent = calcWaitTime() + ' dakika';
}

/* ─── MODAL ─── */
function openModal(type, ...args) {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('open');
  overlay.dataset.type = type;
  overlay.dataset.args = JSON.stringify(args);
  renderModal(type, args);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function renderModal(type, args) {
  const box = document.getElementById('modal-box');

  if(type==='menu-item') {
    const m = menuById(args[0]); if(!m){closeModal();return;}
    const inCart = cart.find(c=>c.id===m.id);
    box.innerHTML = `<div class="modal-handle"></div>
    <img src="${m.img}" style="width:100%;height:220px;object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80'"/>
    <div style="padding:20px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;">
        <h2 class="syne" style="font-size:20px;font-weight:800;flex:1;margin-right:12px;">${m.name}</h2>
        <span class="syne" style="font-size:22px;font-weight:800;color:var(--gold);">${m.price}₺</span>
      </div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">${m.desc}</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
        <div class="card" style="padding:10px;text-align:center;">
          <div class="syne" style="font-weight:800;font-size:15px;">${m.cal}</div>
          <div style="font-size:10px;color:var(--muted);">Kalori</div>
        </div>
        <div class="card" style="padding:10px;text-align:center;">
          <div class="syne" style="font-weight:800;font-size:15px;">${m.prep}dk</div>
          <div style="font-size:10px;color:var(--muted);">Hazırlık</div>
        </div>
        <div class="card" style="padding:10px;text-align:center;">
          <div style="font-size:14px;">${allergenIcons(m)||'—'}</div>
          <div style="font-size:10px;color:var(--muted);">Alerjenler</div>
        </div>
      </div>
      ${inCart ? `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px;border-radius:10px;background:rgba(240,192,96,0.07);border:1px solid rgba(240,192,96,0.18);">
        <span style="font-size:13px;color:var(--muted);">Sepette:</span>
        <button class="btn btn-ghost btn-xs" onclick="cartChange('${m.id}',-1)"><i class="fas fa-minus"></i></button>
        <span class="syne" style="font-weight:800;font-size:16px;">${inCart.qty}</span>
        <button class="btn btn-ghost btn-xs" onclick="cartChange('${m.id}',1)"><i class="fas fa-plus"></i></button>
        <button class="btn btn-red btn-xs" onclick="cartRemove('${m.id}')"><i class="fas fa-trash"></i></button>
      </div>` : ''}
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Geri</button>
        <button class="btn btn-gold" style="flex:1;" onclick="cartAdd('${m.id}');closeModal()"><i class="fas fa-plus"></i> Sepete Ekle</button>
      </div>
    </div>`;
    return;
  }

  if(type==='cart') { renderCartModal(); return; }

  if(type==='waiter-call') {
    const state = DB.get();
    const table = state.tables.find(t=>t.id===TABLE_ID);
    const already = table && table.waiter_call;
    box.innerHTML = `<div class="modal-handle"></div>
    <div style="padding:28px;text-align:center;">
      <div style="font-size:56px;margin-bottom:12px;">${already?'🔔':'🛎️'}</div>
      <h2 class="syne" style="font-size:20px;font-weight:800;margin-bottom:8px;">${already?'Garson Çağrısı Aktif':'Garson Çağır'}</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:22px;">${already?'Garsonunuz en kısa sürede gelecek. Çağrıyı iptal etmek ister misiniz?':'Masa '+TABLE_ID+' için garson çağrısı göndermek istiyor musunuz?'}</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">İptal</button>
        ${already
          ? `<button class="btn btn-red" style="flex:1;" onclick="cancelWaiterCall()"><i class="fas fa-times"></i> İptal Et</button>`
          : `<button class="btn btn-gold" style="flex:1;" onclick="sendWaiterCall()"><i class="fas fa-bell"></i> Çağır</button>`}
      </div>
    </div>`;
    return;
  }

  if(type==='camera') {
    box.innerHTML = `<div class="modal-handle"></div>
    <div style="padding:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h2 class="syne" style="font-size:17px;font-weight:800;">🎥 Canlı Mutfak Kamerası</h2>
        <button onclick="closeModal()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;">✕</button>
      </div>
      <div style="background:#060610;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);position:relative;">
        <div style="text-align:center;">
          <i class="fas fa-video" style="font-size:40px;color:var(--muted);display:block;margin-bottom:10px;"></i>
          <p style="color:var(--muted);font-size:12px;">Canlı mutfak görüntüsü<br/>(RTSP / WebRTC feed)</p>
        </div>
        <span class="badge b-red" style="position:absolute;top:12px;right:12px;"><span style="width:6px;height:6px;border-radius:50%;background:#ff4b4b;display:inline-block;margin-right:4px;animation:pulse 1s infinite;"></span>CANLI</span>
      </div>
      <p style="color:var(--muted);font-size:11px;margin-top:10px;text-align:center;">Gerçek ortamda IP kamera iframe veya WebRTC stream entegre edilir.</p>
    </div>`;
    return;
  }

  box.innerHTML = `<div class="modal-handle"></div><div style="padding:24px;text-align:center;color:var(--muted);">İçerik bulunamadı.</div>`;
}

function renderCartModal() {
  const box = document.getElementById('modal-box');
  if(!cart.length) {
    box.innerHTML = `<div class="modal-handle"></div>
    <div style="padding:28px;text-align:center;">
      <div style="font-size:48px;margin-bottom:12px;">🛒</div>
      <p style="color:var(--muted);">Sepetiniz boş. Menüden ürün ekleyin.</p>
      <button class="btn btn-ghost" style="margin-top:16px;width:100%;" onclick="closeModal()">Menüye Dön</button>
    </div>`; return;
  }
  const total = cartTotal();
  box.innerHTML = `<div class="modal-handle"></div>
  <div class="cart-modal" style="padding:20px;">
    <h2 class="syne" style="font-size:18px;font-weight:800;margin-bottom:16px;">🛒 Sepetim — Masa ${TABLE_ID}</h2>
    ${cart.map(c=>{ const m=menuById(c.id);if(!m)return''; return `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
      <img src="${m.img}" style="width:44px;height:44px;border-radius:10px;object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200&q=60'"/>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:500;">${m.name}</div>
        <div style="font-size:11px;color:var(--muted);">${m.price}₺ / adet</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="btn btn-ghost btn-xs" onclick="cartChange('${m.id}',-1)"><i class="fas fa-minus"></i></button>
        <span class="syne" style="font-weight:800;min-width:18px;text-align:center;">${c.qty}</span>
        <button class="btn btn-ghost btn-xs" onclick="cartChange('${m.id}',1)"><i class="fas fa-plus"></i></button>
      </div>
      <span class="syne" style="font-weight:800;color:var(--gold);min-width:52px;text-align:right;">${m.price*c.qty}₺</span>
      <button onclick="cartRemove('${m.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
    </div>`; }).join('')}
    <div style="display:flex;justify-content:space-between;padding:12px 0;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;">
      <span>Toplam</span><span style="color:var(--gold);">${total}₺</span>
    </div>
    <textarea class="inp" id="order-note" placeholder="Özel istek veya not (opsiyonel)..." rows="2" style="margin-bottom:12px;"></textarea>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Devam Et</button>
      <button class="btn btn-gold" style="flex:1;" onclick="submitOrder()"><i class="fas fa-paper-plane"></i> Siparişi Gönder</button>
    </div>
  </div>`;
}

/* ─── SUBMIT ORDER → mutfağa ─── */
function submitOrder() {
  if(!cart.length){ toast('Sepetiniz boş!','warn'); return; }
  const note = document.getElementById('order-note')?.value || '';
  const now = new Date().toISOString();
  DB.update(state => {
    const table = state.tables.find(t=>t.id===TABLE_ID);
    if(!table) return;
    // Sepeti masanın orders'ına merge et
    cart.forEach(c => {
      const ex = (table.orders||[]).find(o=>o.id===c.id);
      if(ex) ex.qty += c.qty;
      else (table.orders = table.orders||[], table.orders.push({id:c.id, qty:c.qty, note, sentAt:now}));
    });
    table.status = 'occupied';
    if(!table.order_time) table.order_time = now;
  });
  const cnt = cartCount();
  cart = [];
  updateCartUI();
  closeModal();
  renderMyOrders();
  toast(`🚀 ${cnt} ürün mutfağa gönderildi!`,'success');
  renderMenu();
}

/* ─── WAITER CALL ─── */
function sendWaiterCall() {
  DB.update(s=>{ const t=s.tables.find(t=>t.id===TABLE_ID); if(t){t.waiter_call=true;t.waiter_call_time=new Date().toISOString();} });
  closeModal();
  toast(`🔔 Garson çağrısı gönderildi!`,'warn');
}
function cancelWaiterCall() {
  DB.update(s=>{ const t=s.tables.find(t=>t.id===TABLE_ID); if(t){t.waiter_call=false;t.waiter_call_time=null;} });
  closeModal();
  toast('Garson çağrısı iptal edildi.','success');
}
</script>
</body>
</html>
